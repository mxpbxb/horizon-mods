id = "misogynist_unexpansion_native"
kind = "native-mod"
name = "Minecraft Misogynist Unexpansion"
summary = "The game taken back: the newer mobs out, the original farm animals and their old babies, and recipes for what the removed mobs gave."
description = """
**This mod has two parts, and you need both.** Install this one, the native part, and [Minecraft Misogynist Unexpansion (assets)](https://playhorizon.dev/mods/misogynist_unexpansion), then press Build.

- **Mobs taken out:** dolphins, foxes, sniffers, copper golems, allays, turtles, bees, parrots, husks, strays, polar bears, pandas, camels, llamas, phantoms, frogs, glow squids, striders, camel husks, armadillos, axolotls, happy ghasts, sulfur cubes, nautiluses, trader llamas, zombie nautiluses, bogged, parched, breezes, creakings, tadpoles and goats. Each can be kept again in `removed_mobs.cfg`; nothing else can be removed.
- **No new looks for old mobs:** cows, pigs and chickens only in their original look, wolves only as the original wolf, and every baby the redesign changed (villagers, zombies, piglins, farm animals, wolves, cats, horses and more) drawn the old way.
- **Key Binds search by key:** the Key Binds search finds a binding by the key it is on, as Controlling's does.
- **No sculk in new terrain:** sculk patches and loose sculk veins no longer generate; sculk is crafted from dirt and a bottle o' enchanting, with recipes for sculk veins, sensors, catalysts and shriekers, and a bottle o' enchanting from any mob head.
- **Walk on powder snow** as if you wore leather boots, and **right-click a grown crop** to harvest and replant it.
- **Fishing as it was:** treasure anywhere again, not only in open water, and tropical fish 7 times in 100.
- **Recipes for what they gave:** honey (slime, sugar, a bottle), honeycomb (smelted honey), glow ink (ink and glowstone), froglights (a light block ringed with slime), fish eggs (nine tropical fish), fish scales (from tropical fish) and a Potion of Dolphin's Grace (crafted).

Native source mod: it runs with your account's permissions, and is pinned to one Horizon revision. No Minecraft code or assets are included."""
