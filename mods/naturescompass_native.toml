id = "naturescompass_native"
kind = "native-mod"
name = "Nature's Compass"
summary = "A compass that finds biomes: pick one, and the needle points to the nearest."
description = """
**This mod has two parts, and you need both.** Install this one, the native part, and [Nature's Compass (assets)](https://playhorizon.dev/mods/naturescompass), then press Build.

- **Craft** it from a compass, four logs and four saplings.
- **Right-click** it for every biome, modded ones included, in a scrolling list showing each biome's mod. Type to filter, sort by name or mod, and double-click one to search for the nearest of it in your dimension.
- When it is found, the needle **points to it**, and the action bar shows its coordinates and distance. While nothing is found, the needle spins.

A port of [Nature's Compass](https://github.com/MattCzyr/NaturesCompass) by ChaosTheDude, licensed CC BY-NC-SA 4.0; this port is shared under the same licence. Not ported: the info screen and teleporting. Native source mod: it runs with your account's permissions, and is pinned to one Horizon revision. No Minecraft code or assets are included."""
authors = ["ChaosTheDude", "mxpbxb"]
owners = ["mxpbxb"]
owner_ids = [73505523]
license = "CC-BY-NC-SA-4.0"
source = "https://github.com/mxpbxb/natures-compass"
icon = "icons/naturescompass_native.png"
categories = ["utility"]
tags = ["compass", "biomes", "exploration"]

