id = "yukari_gap_native"
kind = "native-mod"
name = "Yukari Gaps Beta"
summary = "Gaps to travel between: place and name a gap, lock it to yourself if you like, and step to any other."
description = """
**This mod has two parts, and you need both.** Install this one, the native part, and [Yukari Gaps Beta (assets)](https://playhorizon.dev/mods/yukari_gap), then press Build.

- **Craft** a Yukari Gap from four amethyst shards, four ender pearls and a gold ingot.
- **Place** it where there are two free blocks and name it. A name another gap has gets a number: Home (2), Home (3).
- **Lock** it in the same window and only you can use it or break it. Unlocked, every player can.
- **Right-click** any gap for a big screen of every gap you may use, in rows with a scroll bar. Click one to go.
- **Travel is free**, however far, and to any dimension.
- **Sneak and right-click** your own gap to rename it or change its lock.

In the world a gap is an eye-gap picture that leans and always turns to face you.

Beta: new, and still being tried. Native source mod: it runs with your account's permissions, and is pinned to one Horizon revision.

Inspired by Waystones by BlayTheNinth; no code or assets of it are included. Yukari Yakumo is from the Touhou Project by ZUN: a non-commercial fan work. No Minecraft code or assets are included. MIT licensed."""
authors = ["mxpbxb"]
