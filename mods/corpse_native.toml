id = "corpse_native"
kind = "native-mod"
name = "Corpse"
summary = "Your things stay where you died: death drops go into your corpse, to take back with a right-click."
description = """
When you die, everything you drop is gathered into your corpse: your body, lying where you fell, in your own skin.

- **Nothing is left on the ground** to despawn. The chat tells you where your corpse is, and again when you respawn.
- **Right-click** it to open it: click an item to take it, or the chest to take everything that fits.
- When it is empty, the body is gone. Corpses don't despawn or take damage, and are saved with the world.
- Any player can open any corpse.

One file: it needs no content mod, the body is a vanilla mannequin. Native source mod: it runs with your account's permissions, and is pinned to one Horizon revision.

Inspired by [Corpse](https://github.com/henkelmax/corpse) by Max Henkel; written from scratch for Horizon, no code or assets of it are included. No Minecraft code or assets are included. MIT licensed."""
authors = ["mxpbxb"]
