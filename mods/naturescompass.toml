id = "naturescompass"
kind = "mod"
name = "Nature's Compass (assets)"
summary = "The item, art, names and recipe of Nature's Compass. Needs the Nature's Compass native mod."
description = """
**This is one of the two parts of [Nature's Compass](https://playhorizon.dev/mods/naturescompass_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the compass item, its 32 needle frames, its name in 14 languages and its recipe. It has no code: what the mod does is described on Nature's Compass.

The textures and names are from [Nature's Compass](https://github.com/MattCzyr/NaturesCompass) by ChaosTheDude, licensed CC BY-NC-SA 4.0, unchanged; this port is shared under the same licence. No Minecraft assets are included."""
