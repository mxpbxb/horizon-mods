name = "Yukari Gaps Beta (assets)"
summary = "The block, item, art and recipe of Yukari Gaps Beta. Needs the Yukari Gaps Beta native mod."
description = """
**This is one of the two parts of [Yukari Gaps Beta](https://playhorizon.dev/mods/yukari_gap_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the gap block, its item, the eye-gap picture and the recipe. It has no code: what the mod does is described on Yukari Gaps Beta.

The art is original, by mxpbxb. No Minecraft assets are included. MIT licensed."""
