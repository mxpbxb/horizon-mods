id = "thmobs"
kind = "mod"
name = "Touhou Mobs (assets)"
summary = "The mobs, textures and spawn eggs of Touhou Mobs. Needs the Touhou Mobs native mod."
description = """
**This is one of the two parts of [Touhou Mobs](https://playhorizon.dev/mods/thmobs_native), and does nothing alone.** Install both: this one, the assets, and the native part.

It holds the 30 mobs' types, their textures and spawn eggs, and the danmaku sheets, from the original mods (Touhou Items Mod by kuro-anco, SPELLCARD PLUS, and Journey To Gensokyo by Katrix), used with their creators' permission."""
authors = ["kuro-anco, Katrix and the SPELLCARD PLUS author (originals)", "mxpbxb (Horizon port)"]
owners = ["mxpbxb"]
owner_ids = [73505523]
license = "All Rights Reserved"
source = "https://github.com/mxpbxb/touhou-mobs"
icon = "icons/thmobs.png"
categories = ["adventure", "library"]
tags = ["touhou", "mobs", "assets"]

